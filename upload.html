<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CycleBoss — Upload Workout</title>
<style>
  :root {
    --z1: #ffffff;
    --z2: #00cfff;
    --z3: #39ff14;
    --z4: #FFFA8A;
    --z5: #ff0033;
    --bg: #0b0b10;
    --panel: #16161f;
    --panel2: #1e1e2a;
    --text: #f0f0f5;
    --muted: #8a8a9a;
    --accent: #00cfff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100dvh;
    padding: 20px;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 1.6rem; letter-spacing: 0.04em; margin-bottom: 4px; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin-bottom: 24px; font-size: 0.9rem; }

  .card {
    background: var(--panel);
    border: 1px solid #2a2a38;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }
  label { display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 6px; }
  input, select {
    width: 100%;
    background: var(--panel2);
    border: 1px solid #33334a;
    border-radius: 8px;
    color: var(--text);
    padding: 10px 12px;
    font-size: 1rem;
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .row { display: flex; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 140px; }

  /* Interval grid */
  .interval {
    display: grid;
    grid-template-columns: 2fr 70px 70px 90px 70px 70px 36px;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
  }
  .interval input, .interval select { padding: 8px; font-size: 0.9rem; }
  .interval .del {
    background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1.1rem;
  }
  .interval .del:hover { color: var(--z5); }
  .headers {
    display: grid;
    grid-template-columns: 2fr 70px 70px 90px 70px 70px 36px;
    gap: 8px;
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-bottom: 6px;
  }
  @media (max-width: 640px) {
    .interval, .headers { grid-template-columns: 1fr 60px 60px 80px; }
    .headers div:nth-child(n+5), .interval > *:nth-child(n+5) { display: none; }
    .interval .del { display: block !important; grid-column: 4; }
  }

  button.primary {
    background: var(--accent);
    color: #001018;
    border: none;
    border-radius: 8px;
    padding: 12px 20px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
  }
  button.primary:disabled { opacity: 0.4; cursor: not-allowed; }
  button.ghost {
    background: none;
    border: 1px dashed #44445c;
    color: var(--muted);
    border-radius: 8px;
    padding: 10px 16px;
    cursor: pointer;
    width: 100%;
    margin-top: 4px;
  }
  button.ghost:hover { color: var(--text); border-color: var(--accent); }

  /* Preview */
  .preview-bar { display: flex; height: 34px; border-radius: 6px; overflow: hidden; margin-bottom: 12px; }
  .preview-bar div { min-width: 2px; }
  .preview-list .pitem {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 10px; border-radius: 6px; background: var(--panel2); margin-bottom: 5px;
    font-size: 0.9rem;
  }
  .pitem .swatch { width: 6px; height: 22px; border-radius: 3px; flex-shrink: 0; }
  .pitem .pname { flex: 1; }
  .pitem .ptime { color: var(--muted); font-variant-numeric: tabular-nums; }
  .total { color: var(--muted); font-size: 0.85rem; margin-top: 8px; }

  .msg { padding: 12px; border-radius: 8px; margin-top: 12px; font-size: 0.9rem; display: none; }
  .msg.ok { display: block; background: rgba(57,255,20,0.08); border: 1px solid var(--z3); color: var(--z3); }
  .msg.err { display: block; background: rgba(255,0,51,0.08); border: 1px solid var(--z5); color: var(--z5); }

  .signin { text-align: center; padding: 48px 20px; }
  .signin p { color: var(--muted); margin-bottom: 20px; }
  .userbar { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; font-size: 0.85rem; color: var(--muted); }
  .userbar img { width: 28px; height: 28px; border-radius: 50%; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Cycle<span>Boss</span> Upload</h1>
  <div class="sub">Build a workout and publish it to the site.</div>

  <!-- SIGN IN -->
  <div id="signin" class="card signin">
    <p>Sign in with your GitHub account to upload workouts.</p>
    <button class="primary" onclick="signIn()">Sign in with GitHub</button>
  </div>

  <!-- APP -->
  <div id="app" class="hidden">
    <div class="userbar">
      <img id="avatar" alt="">
      <span>Signed in as <b id="username"></b></span>
    </div>

    <div class="card">
      <div class="row">
        <div>
          <label for="wname">Workout name</label>
          <input id="wname" placeholder="e.g. tuesday-burner" oninput="render()">
        </div>
        <div>
          <label for="vfile">Video filename (optional)</label>
          <input id="vfile" placeholder="e.g. GH010042.mp4">
        </div>
      </div>

      <label>Intervals</label>
      <div class="headers">
        <div>Name</div><div>Min</div><div>Sec</div><div>Zone</div><div>RPM</div><div>FTP%</div><div></div>
      </div>
      <div id="intervals"></div>
      <button class="ghost" onclick="addInterval()">+ Add interval</button>
    </div>

    <div class="card">
      <label>Preview</label>
      <div class="preview-bar" id="pbar"></div>
      <div class="preview-list" id="plist"></div>
      <div class="total" id="ptotal"></div>
    </div>

    <button class="primary" id="uploadBtn" onclick="upload()">Upload workout</button>
    <div class="msg" id="msg"></div>
  </div>
</div>

<script>
const FN = "https://cycleboss.netlify.app/.netlify/functions"; // change if hosting functions elsewhere
const ZONE_COLORS = { 1:"#ffffff", 2:"#00cfff", 3:"#39ff14", 4:"#FFFA8A", 5:"#ff0033" };
function colorFor(zone, ftp) {
  if (ftp >= 120) return "#ff1a1a";
  if (ftp === 90) return "#aadc45";
  if (ftp === 80) return "#00c9a0";
  return ZONE_COLORS[zone] || "#ffffff";
}

let token = sessionStorage.getItem("gh_token");

// ---- Auth ----
function signIn() {
  fetch(FN + "/auth?action=login").then(r=>r.json()).then(d=>{ location.href = d.url; });
}
async function handleCallback() {
  const code = new URLSearchParams(location.search).get("code");
  if (!code) return;
  history.replaceState({}, "", location.pathname);
  const r = await fetch(FN + "/auth?action=token&code=" + encodeURIComponent(code));
  const d = await r.json();
  if (d.token) { token = d.token; sessionStorage.setItem("gh_token", token); }
}
async function loadUser() {
  if (!token) return false;
  const r = await fetch("https://api.github.com/user", { headers: { Authorization: "Bearer " + token }});
  if (!r.ok) { sessionStorage.removeItem("gh_token"); token = null; return false; }
  const u = await r.json();
  document.getElementById("username").textContent = u.login;
  document.getElementById("avatar").src = u.avatar_url;
  return true;
}

// ---- Intervals ----
function addInterval(data) {
  const d = data || { name:"", min:"", sec:0, zone:2, rpm:"", ftp:"" };
  const div = document.createElement("div");
  div.className = "interval";
  div.innerHTML = `
    <input class="i-name" placeholder="Interval name" value="${d.name}">
    <input class="i-min" type="number" min="0" value="${d.min}">
    <input class="i-sec" type="number" min="0" max="59" value="${d.sec}">
    <select class="i-zone">
      ${[1,2,3,4,5].map(z=>`<option value="${z}" ${z==d.zone?"selected":""}>Z${z}</option>`).join("")}
    </select>
    <input class="i-rpm" type="number" min="0" value="${d.rpm}">
    <input class="i-ftp" type="number" min="0" value="${d.ftp}">
    <button class="del" title="Remove" onclick="this.parentElement.remove(); render()">✕</button>`;
  div.querySelectorAll("input,select").forEach(el=>el.addEventListener("input", render));
  document.getElementById("intervals").appendChild(div);
  render();
}
function readIntervals() {
  return [...document.querySelectorAll(".interval")].map(el=>({
    name: el.querySelector(".i-name").value.trim(),
    seconds: (parseInt(el.querySelector(".i-min").value)||0)*60 + (parseInt(el.querySelector(".i-sec").value)||0),
    zone: parseInt(el.querySelector(".i-zone").value),
    rpm: parseInt(el.querySelector(".i-rpm").value)||null,
    ftp: parseInt(el.querySelector(".i-ftp").value)||null
  }));
}
function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }
function render() {
  const iv = readIntervals();
  const total = iv.reduce((a,b)=>a+b.seconds,0) || 1;
  document.getElementById("pbar").innerHTML = iv.filter(i=>i.seconds>0).map(i=>
    `<div style="flex:${i.seconds/total};background:${colorFor(i.zone,i.ftp)}"></div>`).join("");
  document.getElementById("plist").innerHTML = iv.map(i=>
    `<div class="pitem"><div class="swatch" style="background:${colorFor(i.zone,i.ftp)}"></div>
     <div class="pname">${i.name||"<i style='color:var(--muted)'>unnamed</i>"}</div>
     <div class="ptime">${fmt(i.seconds)}</div></div>`).join("");
  document.getElementById("ptotal").textContent = "Total: " + fmt(iv.reduce((a,b)=>a+b.seconds,0));
}

// ---- Upload ----
async function upload() {
  const msg = document.getElementById("msg");
  msg.className = "msg";
  const name = document.getElementById("wname").value.trim();
  const iv = readIntervals().filter(i=>i.name && i.seconds>0);
  if (!name) return showErr("Give the workout a name.");
  if (!iv.length) return showErr("Add at least one interval with a name and a time.");
  const btn = document.getElementById("uploadBtn");
  btn.disabled = true; btn.textContent = "Uploading…";
  try {
    const r = await fetch(FN + "/upload-workout", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
      body: JSON.stringify({ name, video: document.getElementById("vfile").value.trim(), intervals: iv })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Upload failed");
    msg.className = "msg ok";
    msg.textContent = "Uploaded! It will be live at " + d.url + " in about a minute.";
  } catch(e) {
    showErr(e.message);
  } finally {
    btn.disabled = false; btn.textContent = "Upload workout";
  }
}
function showErr(t){ const m=document.getElementById("msg"); m.className="msg err"; m.textContent=t; }

// ---- Init ----
(async function(){
  await handleCallback();
  if (await loadUser()) {
    document.getElementById("signin").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    if (!document.querySelector(".interval")) { addInterval({name:"Warmup",min:5,sec:0,zone:1,rpm:"",ftp:""}); addInterval(); }
  }
})();
</script>
</body>
</html>
